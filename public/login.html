<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
    }

    body {
        font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
    }

    /* ==============================
       BACKGROUND
    ============================== */

    .page-bg {
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;

        background:
            radial-gradient(
                circle at 15% 20%,
                rgba(99, 102, 241, 0.13),
                transparent 30%
            ),
            radial-gradient(
                circle at 85% 80%,
                rgba(37, 99, 235, 0.12),
                transparent 32%
            ),
            linear-gradient(
                135deg,
                #f8fafc 0%,
                #eef2ff 50%,
                #eff6ff 100%
            );
    }

    /* Decorative circles */

    .bg-circle {
        position: absolute;
        border-radius: 999px;
        pointer-events: none;
        filter: blur(55px);
    }

    .circle-one {
        width: 220px;
        height: 220px;
        top: -100px;
        right: -70px;
        background: rgba(99, 102, 241, 0.16);
    }

    .circle-two {
        width: 240px;
        height: 240px;
        bottom: -120px;
        left: -90px;
        background: rgba(59, 130, 246, 0.13);
    }

    /* ==============================
       LOGIN CARD
    ============================== */

    .login-card {
        width: min(100% - 32px, 430px);
        max-height: calc(100dvh - 24px);
        overflow: hidden;

        background: rgba(255, 255, 255, 0.96);

        border: 1px solid rgba(255, 255, 255, 0.9);

        border-radius: 28px;

        box-shadow:
            0 25px 70px rgba(15, 23, 42, 0.13),
            0 8px 25px rgba(15, 23, 42, 0.05);

        padding: 28px;

        animation: cardEnter 0.45s ease-out;
    }

    @keyframes cardEnter {
        from {
            opacity: 0;
            transform: translateY(14px) scale(0.98);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* ==============================
       LOGO
    ============================== */

    .logo-box {
        width: 64px;
        height: 64px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 19px;

        background:
            linear-gradient(
                135deg,
                #2563eb 0%,
                #4f46e5 55%,
                #7c3aed 100%
            );

        box-shadow:
            0 14px 30px rgba(79, 70, 229, 0.24);

        position: relative;
    }

    .logo-box::after {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        pointer-events: none;
    }

    /* ==============================
       INPUT
    ============================== */

    .input-field {
        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease,
            background 0.2s ease,
            transform 0.2s ease;
    }

    .input-field:focus {
        background: #ffffff;
        transform: translateY(-1px);
    }

    /* ==============================
       LOGIN BUTTON
    ============================== */

    .login-btn {
        background:
            linear-gradient(
                135deg,
                #2563eb 0%,
                #4f46e5 100%
            );

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            opacity 0.2s ease;
    }

    .login-btn:hover:not(:disabled) {
        transform: translateY(-1px);

        box-shadow:
            0 12px 28px rgba(79, 70, 229, 0.25);
    }

    .login-btn:active:not(:disabled) {
        transform: translateY(0);
    }

    .login-btn:disabled {
        opacity: 0.65;
        cursor: not-allowed;
    }

    /* ==============================
       GOOGLE LOGIN
    ============================== */

    .google-wrapper {
        min-height: 40px;
    }

    .google-wrapper iframe {
        max-width: 100% !important;
    }

    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 480px) {

        .login-card {
            width: calc(100% - 24px);
            max-height: calc(100dvh - 16px);
            padding: 22px 18px;
            border-radius: 24px;
        }

        .logo-box {
            width: 56px;
            height: 56px;
            border-radius: 17px;
        }

        .logo-box::after {
            border-radius: 16px;
        }

        .brand-title {
            font-size: 23px;
        }

        .welcome-title {
            font-size: 20px;
        }

        .form-area {
            gap: 12px;
        }

        .input-field {
            height: 46px !important;
        }

        .login-btn {
            height: 46px !important;
        }

        .divider {
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .signup-area {
            margin-top: 15px;
        }

        .security-note {
            margin-top: 12px;
        }
    }

    @media (max-height: 700px) {

        .login-card {
            padding-top: 18px;
            padding-bottom: 18px;
        }

        .brand-area {
            margin-bottom: 14px !important;
        }

        .welcome-area {
            margin-bottom: 14px !important;
        }

        .divider {
            margin-top: 12px;
            margin-bottom: 12px;
        }

        .signup-area {
            margin-top: 12px;
        }

        .security-note {
            margin-top: 8px;
        }
    }
</style>

</head>

<script>

/* =========================================================
   PASSWORD SHOW / HIDE
========================================================= */

const passwordInput =
    document.getElementById("password");

const togglePassword =
    document.getElementById("toggle-password");

const eyeIcon =
    document.getElementById("eye-icon");


togglePassword.addEventListener(
    "click",
    function () {

        const isPassword =
            passwordInput.type === "password";

        passwordInput.type =
            isPassword
                ? "text"
                : "password";


        togglePassword.setAttribute(
            "aria-label",
            isPassword
                ? "Hide password"
                : "Show password"
        );


        if (isPassword) {

            eyeIcon.innerHTML = `
                <path d="M3 3L21 21"></path>
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                <path d="M9.9 4.2A10.6 10.6 0 0 1 12 4
                         c6.5 0 10 7 10 7
                         a18.3 18.3 0 0 1-3.1 4.3"></path>
                <path d="M6.2 6.2C3.5 8.1 2 11 2 11
                         s3.5 7 10 7
                         a10.7 10.7 0 0 0 4.1-.8"></path>
            `;

        } else {

            eyeIcon.innerHTML = `
                <path d="M2 12s3.5-7 10-7
                         10 7 10 7-3.5 7-10 7
                         -10-7-10-7Z"></path>

                <circle
                    cx="12"
                    cy="12"
                    r="3">
                </circle>
            `;

        }

    }
);


/* =========================================================
   EMAIL LOGIN
========================================================= */

document
    .getElementById("login-form")
    .addEventListener(
        "submit",
        async function (e) {

            e.preventDefault();


            const button =
                document.getElementById("login-btn");

            const buttonText =
                document.getElementById("login-btn-text");


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("password")
                    .value;


            if (!email || !password) {

                alert(
                    "Please enter email and password."
                );

                return;
            }


            try {

                button.disabled = true;

                buttonText.innerText =
                    "Signing in...";


                const response =
                    await fetch(
                        "/api/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body:
                                JSON.stringify({
                                    email: email,
                                    password: password
                                })
                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "Login Response:",
                    data
                );


                if (!response.ok) {

                    alert(
                        data.message ||
                        "Login failed."
                    );

                    return;
                }


                if (data.success === true) {

                    window.location.replace("/");

                    return;
                }


                alert(
                    data.message ||
                    "Invalid email or password."
                );


            } catch (error) {

                console.error(
                    "Login Error:",
                    error
                );


                alert(
                    "Unable to connect to server. Please try again."
                );


            } finally {

                button.disabled = false;

                buttonText.innerText =
                    "Sign In";

            }

        }
    );


/* =========================================================
   GOOGLE LOGIN
========================================================= */

async function handleCredentialResponse(
    response
) {

    try {

        console.log(
            "Google credential received."
        );


        if (
            !response ||
            !response.credential
        ) {

            alert(
                "Google authentication token missing."
            );

            return;
        }


        const res =
            await fetch(
                "/api/google-login",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body:
                        JSON.stringify({
                            token:
                                response.credential
                        })

                }
            );


        const data =
            await res.json();


        console.log(
            "Google Login Response:",
            data
        );


        if (
            res.ok &&
            data.success === true
        ) {

            window.location.replace("/");

            return;
        }


        alert(
            data.message ||
            "Google Login Failed."
        );


    } catch (error) {

        console.error(
            "Google Login Error:",
            error
        );


        alert(
            "Google authentication error!"
        );

    }

}

</script>
