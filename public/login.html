<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Website</title>
    <!-- Tailwind CSS CDN for Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Sign-In script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="bg-gradient-to-br from-slate-50 via-indigo-50/30 to-blue-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-100 p-8 space-y-6">

        <!-- Header -->
        <div class="text-center space-y-2">
            <h2 class="text-3xl font-bold tracking-tight text-slate-900">Welcome Back</h2>
            <p class="text-sm text-slate-500">Please enter your details to sign in</p>
        </div>

        <!-- Normal Login Form -->
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent text-sm transition-all bg-slate-50/50">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                <input type="password" id="password" placeholder="••••••••" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent text-sm transition-all bg-slate-50/50">
            </div>

            <button type="submit"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/20 transition-all duration-200 text-sm">
                Sign In
            </button>
        </form>

        <!-- Divider -->
        <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-4 text-slate-400 text-xs uppercase tracking-wider font-medium">Or continue with</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- Google Login Button Container (Single Clean Config) -->
        <div class="flex justify-center w-full">
            <div id="g_id_onload" data-client_id="339453629917-p612mtgmhtdal56751jf125koidm1obp.apps.googleusercontent.com"
                data-callback="handleCredentialResponse" data-auto_prompt="false">
            </div>
            <div class="g_id_signin w-full flex justify-center" data-type="standard" data-shape="rectangular"
                data-theme="outline" data-text="sign_in_with" data-size="large" data-logo_alignment="left">
            </div>
        </div>

        <!-- Footer Link -->
        <p class="text-center text-sm text-slate-500">
            Don't have an account?
            <a href="/signup.html" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Sign up</a>
        </p>

    </div>

    <script>
        // Normal Login Script - Now redirects to '/' so server checks subscription smartly!
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = '/'; // 👈 Server-ku anupprom, athu active-ah iruntha index.html-kum, illena pay.html-kum anuppum!
                } else {
                    alert(data.message || "Login failed");
                }
            } catch (err) {
                alert("Something went wrong!");
            }
        };

        // Google Login Response Handler - Now redirects to '/' as well
        async function handleCredentialResponse(response) {
            try {
                const res = await fetch('/api/google-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = '/'; // 👈 Server smart check-ku anupprom
                } else {
                    alert(data.message || "Google Login Failed");
                }
            } catch (err) {
                alert("Google authentication error!");
            }
        }
    </script>
</body>

</html>
