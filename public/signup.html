<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Website</title>
    <!-- Tailwind CSS CDN for Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-slate-50 via-indigo-50/30 to-blue-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-100 p-8 space-y-6">

        <!-- Header -->
        <div class="text-center space-y-2">
            <h2 class="text-3xl font-bold tracking-tight text-slate-900">Create Account</h2>
            <p class="text-sm text-slate-500">Sign up to get started with your subscription</p>
        </div>

        <!-- Signup Form -->
        <form id="signup-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent text-sm transition-all bg-slate-50/50">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                <input type="password" id="password" placeholder="••••••••" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent text-sm transition-all bg-slate-50/50">
            </div>

            <button type="submit"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/20 transition-all duration-200 text-sm">
                Sign Up
            </button>
        </form>

        <!-- Footer Link -->
        <p class="text-center text-sm text-slate-500">
            Already have an account?
            <a href="/login.html" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Sign in</a>
        </p>

    </div>

    <script>
        document.getElementById('signup-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                alert(data.message);
                if (data.success) {
                    window.location.href = '/login.html';
                }
            } catch (err) {
                alert("Something went wrong during signup!");
            }
        };
    </script>
</body>

</html>
