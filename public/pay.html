<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pay ₹49 Subscription</title>
    <!-- Tailwind CSS (Optional, style-ku) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96 text-center">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Unlock Premium Content</h2>
        <p class="text-gray-600 mb-6">Pay ₹49 to get 1 Month full access to all 108 pages.</p>
        <button id="pay-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
            Pay ₹49 Now
        </button>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        document.getElementById('pay-btn').onclick = async function (e) {
            try {
                // 1. Backend-la order create panrathu
                const response = await fetch('/api/create-order', { method: 'POST' });
                const order = await response.json();

                if (!order.id) {
                    alert("Order creation failed!");
                    return;
                }

                // 2. Razorpay popup open panrathu
                const options = {
                    "key": "rzp_live_Thtmj5Jg8ttHTE", // <-- Inga ungaloda Razorpay Test Key ID-ah podunga (e.g., rzp_test_xxxxx)
                    "amount": order.amount,
                    "currency": "INR",
                    "name": "Unga Website",
                    "description": "1 Month Subscription",
                    "order_id": order.id,
                    "handler": async function (response) {
                        // 3. Payment success aanathum verify panrathu
                        const verifyRes = await fetch('/api/verify-payment', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(response)
                        });
                        const result = await verifyRes.json();
                        
                        if(result.success) {
                            alert("Payment Successful! 1 Month Access Activated.");
                            
                            // 1 Second delay to ensure DB sync & direct redirect to protected-pages/index.html
                            setTimeout(() => {
                                window.location.href = "/pages/index.html";
                            }, 1000); 
                        } else {
                            alert("Payment verification failed!");
                        }
                    },
                    "theme": { "color": "#3399cc" }
                };
                
                const rzp = new Razorpay(options);
                rzp.open();
            } catch (err) {
                console.error(err);
                alert("Something went wrong!");
            }
        }
    </script>
</body>
</html>
