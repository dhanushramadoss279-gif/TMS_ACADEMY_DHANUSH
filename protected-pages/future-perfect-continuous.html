            gap: 8px;
            padding: 10px;
            background: var(--bg);
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--border);
            cursor: pointer;
            min-width: 0;
        }

        .progress-item span:last-child {

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .progress-item.completed {
            background-color: var(--success-bg);
            border-color: #bbf7d0;
            color: var(--success);
        }

        .check-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--border);

            display: flex;
            align-items: center;

            font-size: 10px;

            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            flex-shrink: 0;
            min-height: 42px;
            touch-action: manipulation;

            font-size: 0.85rem;
            margin: 12px 0;

            border: 1px dashed #93c5fd;
            word-break: break-word;
            line-height: 1.7;

            background: #eff6ff;

    </section>

let score = 0;

let currentShuffledOptions = [];
let topicProgress = [false, false];


/* =========================================================
   PAGE LOAD
========================================================= */

window.onload = function () {

    renderProgressTracker();

    renderPills();

    loadTopic(0);

};


/* =========================================================
   PROGRESS TRACKER
========================================================= */

function renderProgressTracker() {

    const grid =
        document.getElementById("progress-tracker-grid");

    grid.innerHTML = "";

    const completedCount =
        topicProgress.filter(Boolean).length;

    document.getElementById(
        "overall-progress-text"
    ).innerText =
        `${completedCount} / ${futurePerfectContinuousTopics.length} Completed`;


    futurePerfectContinuousTopics.forEach((topic, idx) => {

        const item =
            document.createElement("div");

        item.className =
            `progress-item ${topicProgress[idx] ? "completed" : ""}`;

        item.onclick =
            () => loadTopic(idx);

        item.innerHTML = `

            <div class="check-icon">
                ${topicProgress[idx] ? "✓" : idx + 1}
            </div>

            <span>
                ${topic.title}
            </span>

        `;

        grid.appendChild(item);

    });

}


/* =========================================================
   TOPIC PILLS
========================================================= */

function renderPills() {

    const pillsContainer =
        document.getElementById("topic-pills");

    pillsContainer.innerHTML = "";

    futurePerfectContinuousTopics.forEach((topic, idx) => {

        const btn =
            document.createElement("button");

        btn.className =
            `pill-btn ${idx === currentTopicIndex ? "active" : ""}`;

        btn.innerText =
            topic.title;

        btn.onclick =
            () => loadTopic(idx);

        pillsContainer.appendChild(btn);

    });

}


/* =========================================================
   LOAD TOPIC
========================================================= */

function loadTopic(index) {

    currentTopicIndex = index;

    currentQuestionIndex = 0;

    score = 0;

    selectedOptionIndex = null;

    renderPills();

    renderTopicContent();

    loadQuestion();

    document.getElementById(

    document.getElementById(

}

/* =========================================================
   SHUFFLE
========================================================= */

function shuffleArray(array) {

    let arr = [...array];

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] =
            [arr[j], arr[i]];

    }

    return arr;

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    const topic =
        futurePerfectContinuousTopics[currentTopicIndex];

    const q =
        topic.questions[currentQuestionIndex];


    document.getElementById(
        "quiz-progress-text"
    ).innerText =
        `Question ${currentQuestionIndex + 1} / ${topic.questions.length}`;


    document.getElementById(
        "question-text"
    ).innerText =
        `${currentQuestionIndex + 1}. ${q.q}`;


    document.getElementById(
        "question-tamil-text"
    ).innerText =
        q.tq;


    let optionObjects =
        q.o.map((optText, idx) => ({

            text: optText,

            isCorrect: idx === q.a

        }));


    currentShuffledOptions =
        shuffleArray(optionObjects);


    const optionsGrid =
        document.getElementById(
            "options-container"
        );

    optionsGrid.innerHTML = "";


    currentShuffledOptions.forEach(
        (optObj, idx) => {

            const btn =
                document.createElement("button");

            btn.className =
                "option-btn";

            btn.innerText =
                optObj.text;

            btn.onclick =
                () => selectOption(idx);

            optionsGrid.appendChild(btn);

        }
    );


    const feedback =
        document.getElementById(
            "feedback-box"
        );

    feedback.style.display = "none";

    feedback.className =
        "feedback-box";

    feedback.innerHTML = "";


    document.getElementById(
        "next-btn"
    ).disabled = true;


    selectedOptionIndex = null;

}


/* =========================================================
   SELECT OPTION
========================================================= */

function selectOption(index) {

    if (selectedOptionIndex !== null) {
        return;
    }

    selectedOptionIndex = index;


    const topic =
        futurePerfectContinuousTopics[currentTopicIndex];

    const q =
        topic.questions[currentQuestionIndex];


    const options =
        document.getElementById(
            "options-container"
        ).children;


    const feedback =
        document.getElementById(
            "feedback-box"
        );


    const isCorrectAnswer =
        currentShuffledOptions[index].isCorrect;


    if (isCorrectAnswer) {

        score++;

        options[index]
            .classList
            .add("selected-correct");


        feedback.className =
            "feedback-box correct";


        feedback.innerHTML =
            `<b>✓ சரியான பதில்!</b> ${q.e}`;

    } else {

        options[index]
            .classList
            .add("selected-wrong");


        const correctIndex =
            currentShuffledOptions
                .findIndex(
                    item => item.isCorrect
                );


        options[correctIndex]
            .classList
            .add("selected-correct");


        feedback.className =
            "feedback-box wrong";


        feedback.innerHTML =
            `<b>✗ தவறான பதில்!</b> ${q.e}`;

    }


    Array.from(options)
        .forEach(opt => {
            opt.disabled = true;
        });


    document.getElementById(
        "next-btn"
    ).disabled = false;

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    const topic =
        futurePerfectContinuousTopics[currentTopicIndex];


    if (
        currentQuestionIndex <
        topic.questions.length - 1
    ) {

        currentQuestionIndex++;

        loadQuestion();

    } else {

        showResults();

    }

}


/* =========================================================
   RESULTS
========================================================= */

function showResults() {

    const topic =
        futurePerfectContinuousTopics[currentTopicIndex];


    document.getElementById(
        "question-runner"
    ).style.display = "none";


    document.getElementById(
        "result-runner"
    ).style.display = "block";


    document.getElementById(
        "res-score"
    ).innerText =
        `${score} / ${topic.questions.length}`;


    const percent =
        (score / topic.questions.length) * 100;


    if (percent >= 70) {

        topicProgress[currentTopicIndex] = true;

        renderProgressTracker();

        document.getElementById(
            "res-msg"
        ).innerText =
            "அற்புதமான முயற்சி! 🎉";

    } else {

        document.getElementById(
            "res-msg"
        ).innerText =
            "மீண்டும் முயற்சி செய்து பார்க்கவும்! 👍";

    }

}


/* =========================================================

========================================================= */

function resetCurrentQuiz() {

    loadTopic(currentTopicIndex);
