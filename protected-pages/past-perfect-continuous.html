        @media (max-width: 360px) {

            }

<header>

</header>


<main class="container">

    <div class="hero">

        <p>

<script>

/* =========================================================
   BASIC PAST PERFECT CONTINUOUS QUESTIONS – 50
========================================================= */

const generateBasicQuestions = () => {

    const raw = [

        [
            "I ______ for two hours before he came.",
            "(அவன் வருவதற்கு முன்பு நான் இரண்டு மணி நேரமாக காத்துக் கொண்டிருந்தேன்.)",
            ["had been waiting", "have been waiting", "was waiting", "waited"],
            0,
            "I உடன் Past Perfect Continuous → had been + V-ing."
        ],

        [
            "She ______ English for three hours before dinner.",
            "(இரவு உணவுக்கு முன்பு அவள் மூன்று மணி நேரமாக ஆங்கிலம் படித்துக் கொண்டிருந்தாள்.)",
            ["has been studying", "had been studying", "was studying", "studied"],
            1,
            "Past Perfect Continuous அமைப்பு: had been + studying."
        ],

        [
            "He ______ since morning before he took a break.",
            "(ஓய்வு எடுப்பதற்கு முன்பு அவன் காலை முதல் வேலை செய்து கொண்டிருந்தான்.)",
            ["had been working", "has been working", "was work", "worked"],
            0,
            "He உடன் had been working."
        ],

        [
            "They ______ football for an hour before it started raining.",
            "(மழை பெய்யத் தொடங்குவதற்கு முன்பு அவர்கள் ஒரு மணி நேரமாக கால்பந்து விளையாடிக் கொண்டிருந்தார்கள்.)",
            ["have been playing", "were playing", "had been playing", "played"],
            2,
            "Before + past event இருக்கும்போது had been + V-ing பயன்படுத்தலாம்."
        ],

        [
            "We ______ for the bus for thirty minutes before it arrived.",
            "(பேருந்து வருவதற்கு முன்பு நாங்கள் முப்பது நிமிடங்களாக காத்துக் கொண்டிருந்தோம்.)",
            ["had been waiting", "have waited", "were wait", "waited"],
            0,
            "We → had been waiting."
        ],

        [
            "The baby ______ for ten minutes before its mother came.",
            "(அதன் அம்மா வருவதற்கு முன்பு குழந்தை பத்து நிமிடங்களாக அழுது கொண்டிருந்தது.)",
            ["has been crying", "had been crying", "was cry", "cried"],
            1,
            "The baby = It → had been crying."
        ],

        [
            "She ______ in the company for five years before she resigned.",
            "(அவள் ராஜினாமா செய்வதற்கு முன்பு ஐந்து ஆண்டுகளாக அந்த நிறுவனத்தில் வேலை செய்து கொண்டிருந்தாள்.)",
            ["had been working", "has worked", "was work", "worked"],
            0,
            "கடந்த காலத்தில் மற்றொரு நிகழ்வுக்கு முன் தொடர்ந்து நடந்த செயல்."
        ],

        [
            "I ______ all morning before I went to college.",
            "(கல்லூரிக்குச் செல்வதற்கு முன்பு நான் காலை முழுவதும் படித்துக் கொண்டிருந்தேன்.)",
            ["had been studying", "have studied", "was study", "studied"],
            0,
            "I → had been studying."
        ],

        [
            "He ______ for two hours before he finished the work.",
            "(வேலையை முடிப்பதற்கு முன்பு அவன் இரண்டு மணி நேரமாக வேலை செய்து கொண்டிருந்தான்.)",
            ["had been working", "has been working", "was work", "worked"],
            0,
            "had been + working."
        ],

        [
            "They ______ since 6 a.m. before the teacher arrived.",
            "(ஆசிரியர் வருவதற்கு முன்பு அவர்கள் காலை 6 மணி முதல் படித்துக் கொண்டிருந்தார்கள்.)",
            ["have been studying", "had been studying", "were study", "studied"],
            1,
            "They → had been studying."
        ],

        [
            "We ______ for three hours before the electricity came back.",
            "(மின்சாரம் வந்ததற்கு முன்பு நாங்கள் மூன்று மணி நேரமாக காத்துக் கொண்டிருந்தோம்.)",
            ["had been waiting", "have waited", "were wait", "waited"],
            0,
            "had been waiting சரியான வடிவம்."
        ],

/* =========================================================
   QUIZ VARIABLES
========================================================= */

let currentTopicIndex = 0;
let currentQuestionIndex = 0;
let score = 0;
let selectedOptionIndex = null;
let currentShuffledOptions = [];
let topicProgress = [false, false];


/* =========================================================
   PAGE LOAD
========================================================= */

window.onload = function () {

    renderProgressTracker();

    renderPills();

    loadTopic(0);

};


/* =========================================================
   PROGRESS TRACKER
========================================================= */

function renderProgressTracker() {

    const grid =
        document.getElementById("progress-tracker-grid");

    grid.innerHTML = "";

    const completedCount =
        topicProgress.filter(Boolean).length;

    document.getElementById(
        "overall-progress-text"
    ).innerText =
        `${completedCount} / ${pastPerfectContinuousTopics.length} Completed`;


    pastPerfectContinuousTopics.forEach((topic, idx) => {

        const item =
            document.createElement("div");

        item.className =
            `progress-item ${topicProgress[idx] ? "completed" : ""}`;

        item.onclick =
            () => loadTopic(idx);

        item.innerHTML = `

            <div class="check-icon">
                ${topicProgress[idx] ? "✓" : idx + 1}
            </div>

            <span>
                ${topic.title}
            </span>

        `;

        grid.appendChild(item);

    });

}


/* =========================================================
   TOPIC PILLS
========================================================= */

function renderPills() {

    const pillsContainer =
        document.getElementById("topic-pills");

    pillsContainer.innerHTML = "";

    pastPerfectContinuousTopics.forEach((topic, idx) => {

        const btn =
            document.createElement("button");

        btn.className =
            `pill-btn ${idx === currentTopicIndex ? "active" : ""}`;

        btn.innerText =
            topic.title;

        btn.onclick =
            () => loadTopic(idx);

        pillsContainer.appendChild(btn);

    });

}


/* =========================================================
   LOAD TOPIC
========================================================= */

function loadTopic(index) {

    currentTopicIndex = index;

    currentQuestionIndex = 0;

    score = 0;

    selectedOptionIndex = null;

    renderPills();

    renderTopicContent();

    loadQuestion();

    document.getElementById(
        "question-runner"
    ).style.display = "block";

    document.getElementById(
        "result-runner"
    ).style.display = "none";

}


/* =========================================================
   TOPIC CONTENT
========================================================= */

function renderTopicContent() {

    const topic =
        pastPerfectContinuousTopics[currentTopicIndex];

    const contentBox =
        document.getElementById("topic-content");


    let tableRows =
        topic.tableData.map(row => `

            <tr>

                <td>
                    <b>${row.l}</b>
                </td>

                <td>
                    ${row.t}
                </td>

                <td>

                    <i>${row.e}</i>

                    <span class="sent-ta">
                        ${row.te}
                    </span>

                </td>

            </tr>

        `).join("");


    contentBox.innerHTML = `

        <div class="topic-title">
            ${topic.title} – ${topic.tamilTitle}
        </div>

        <div class="display-chain">
            ${topic.displayChain}
        </div>

        <div class="tamil-explain">
            ${topic.explanation}
        </div>

        <div class="formula-box">

            <strong>
                Past Perfect Continuous Formula:
            </strong>

            <div class="formula-line">
                ${topic.formula}
            </div>

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Structure / Example
                        </th>

                        <th>
                            தமிழ் பொருள்
                        </th>

                        <th>
                            Example Sentence & Meaning
                        </th>

                    </tr>

                </thead>

                <tbody>
                    ${tableRows}
                </tbody>

            </table>

        </div>
    `;


    document.getElementById(
        "quiz-topic-badge"
    ).innerText =
        `${topic.title} Quiz`;

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffleArray(array) {

    let arr = [...array];

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }

    return arr;
}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    const topic =
        pastPerfectContinuousTopics[currentTopicIndex];

    const q =
        topic.questions[currentQuestionIndex];

    selectedOptionIndex = null;

    document.getElementById(
        "quiz-progress-text"
    ).innerText =
        `Question ${currentQuestionIndex + 1} / ${topic.questions.length}`;

    document.getElementById(
        "question-text"
    ).innerText =
        q.q;

    document.getElementById(
        "question-tamil-text"
    ).innerText =
        q.tq;


    const optionsContainer =
        document.getElementById("options-container");

    optionsContainer.innerHTML = "";


    currentShuffledOptions =
        shuffleArray(
            q.o.map((option, index) => ({
                text: option,
                isCorrect: index === q.a
            }))
        );


    currentShuffledOptions.forEach(
        (option, index) => {

            const btn =
                document.createElement("button");

            btn.className =
                "option-btn";

            btn.innerText =
                option.text;

            btn.onclick =
                () => selectOption(index);

            optionsContainer.appendChild(btn);

        }
    );


    const feedback =
        document.getElementById("feedback-box");

    feedback.className =
        "feedback-box";

    feedback.innerHTML =
        "";

    document.getElementById(
        "next-btn"
    ).disabled = true;

}


/* =========================================================
   SELECT OPTION
========================================================= */

function selectOption(index) {

    if (selectedOptionIndex !== null) {
        return;
    }

    selectedOptionIndex = index;


    const topic =
        pastPerfectContinuousTopics[currentTopicIndex];

    const q =
        topic.questions[currentQuestionIndex];


    const options =
        document.getElementById(
            "options-container"
        ).children;


    const feedback =
        document.getElementById(
            "feedback-box"
        );


    const isCorrectAnswer =
        currentShuffledOptions[index].isCorrect;


    if (isCorrectAnswer) {

        score++;

        options[index]
            .classList
            .add("selected-correct");


        feedback.className =
            "feedback-box correct";

        feedback.innerHTML =
            `<b>✓ சரியான பதில்!</b> ${q.e}`;

    } else {

        options[index]
            .classList
            .add("selected-wrong");


        const correctIndex =
            currentShuffledOptions
                .findIndex(
                    item => item.isCorrect
                );


        options[correctIndex]
            .classList
            .add("selected-correct");


        feedback.className =
            "feedback-box wrong";

        feedback.innerHTML =
            `<b>✗ தவறான பதில்!</b> ${q.e}`;

    }


    Array.from(options)
        .forEach(opt => {
            opt.disabled = true;
        });


    document.getElementById(
        "next-btn"
    ).disabled = false;

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    const topic =
        pastPerfectContinuousTopics[currentTopicIndex];


    if (
        currentQuestionIndex <
        topic.questions.length - 1
    ) {

        currentQuestionIndex++;

        loadQuestion();

    } else {

        showResults();

    }

}


/* =========================================================
   RESULTS
========================================================= */

function showResults() {

    const topic =
        pastPerfectContinuousTopics[currentTopicIndex];


    document.getElementById(
        "question-runner"
    ).style.display = "none";


    document.getElementById(
        "result-runner"
    ).style.display = "block";


    document.getElementById(
        "res-score"
    ).innerText =
        `${score} / ${topic.questions.length}`;


    const percent =
        (score / topic.questions.length) * 100;


    if (percent >= 70) {

        topicProgress[currentTopicIndex] = true;

        renderProgressTracker();

        document.getElementById(
            "res-msg"
        ).innerText =
            "அற்புதமான முயற்சி! 🎉";

    } else {

        document.getElementById(
            "res-msg"
        ).innerText =
            "மீண்டும் முயற்சி செய்து பார்க்கவும்! 👍";

    }

}


/* =========================================================
   RETRY
========================================================= */

function resetCurrentQuiz() {

    loadTopic(currentTopicIndex);

}

</script>
