            {l:"They have been waiting for two hours",t:"அவர்கள் இரண்டு மணி நேரமாக காத்திருக்கிறார்கள்",e:"They have been waiting for two hours.",te:"அவர்கள் இரண்டு மணி நேரமாக காத்திருக்கிறார்கள்."},
            {l:"Why has he been studying?",t:"அவர் ஏன் படித்து வருகிறார்?",e:"Why has he been studying at night?",te:"அவர் ஏன் இரவில் படித்து வருகிறார்?"},
            {l:"Have they been working?",t:"அவர்கள் வேலை செய்து வருகிறார்களா?",e:"Have they been working on the project?",te:"அவர்கள் திட்டத்தில் வேலை செய்து வருகிறார்களா?"}
        ],
        questions: generateAdvancedQuestions()

/* =========================================================
   QUIZ VARIABLES
========================================================= */

let currentTopicIndex = 0;
let currentQuestionIndex = 0;
let score = 0;
let selectedOptionIndex = null;
let currentShuffledOptions = [];
let topicProgress = [false, false];


/* =========================================================
   PAGE LOAD
========================================================= */

window.onload = function () {

    renderProgressTracker();

    renderPills();

    loadTopic(0);

};


/* =========================================================
   PROGRESS TRACKER
========================================================= */

function renderProgressTracker() {

    const grid =
        document.getElementById("progress-tracker-grid");

    grid.innerHTML = "";

    const completedCount =
        topicProgress.filter(Boolean).length;

    document.getElementById(
        "overall-progress-text"
    ).innerText =
        `${completedCount} / ${presentPerfectContinuousTopics.length} Completed`;


    presentPerfectContinuousTopics.forEach((topic, idx) => {

        const item =
            document.createElement("div");

        item.className =
            `progress-item ${topicProgress[idx] ? "completed" : ""}`;

        item.onclick =
            () => loadTopic(idx);

        item.innerHTML = `

            <div class="check-icon">
                ${topicProgress[idx] ? "✓" : idx + 1}
            </div>

            <span>
                ${topic.title}
            </span>

        `;

        grid.appendChild(item);

    });

}


/* =========================================================
   TOPIC PILLS
========================================================= */

function renderPills() {

    const pillsContainer =
        document.getElementById("topic-pills");

    pillsContainer.innerHTML = "";

    presentPerfectContinuousTopics.forEach((topic, idx) => {

        const btn =
            document.createElement("button");

        btn.className =
            `pill-btn ${idx === currentTopicIndex ? "active" : ""}`;

        btn.innerText =
            topic.title;

        btn.onclick =
            () => loadTopic(idx);

        pillsContainer.appendChild(btn);

    });

}


/* =========================================================
   LOAD TOPIC
========================================================= */

function loadTopic(index) {

    currentTopicIndex = index;

    currentQuestionIndex = 0;

    score = 0;

    selectedOptionIndex = null;

    renderPills();

    renderTopicContent();

    loadQuestion();

    document.getElementById(
        "question-runner"
    ).style.display = "block";

    document.getElementById(
        "result-runner"
    ).style.display = "none";

}


/* =========================================================
   TOPIC CONTENT
========================================================= */

function renderTopicContent() {

    const topic =
        presentPerfectContinuousTopics[currentTopicIndex];

    const contentBox =
        document.getElementById("topic-content");


    let tableRows =
        topic.tableData.map(row => `

            <tr>

                <td>
                    <b>${row.l}</b>
                </td>

                <td>
                    ${row.t}
                </td>

                <td>

                    <i>${row.e}</i>

                    <span class="sent-ta">
                        ${row.te}
                    </span>

                </td>

            </tr>

        `).join("");


    contentBox.innerHTML = `

        <div class="topic-title">
            ${topic.title} – ${topic.tamilTitle}
        </div>

        <div class="display-chain">
            ${topic.displayChain}
        </div>

        <div class="tamil-explain">
            ${topic.explanation}
        </div>

        <div class="formula-box">

            <strong>
                Present Perfect Continuous Formula:
            </strong>

            <div class="formula-line">
                ${topic.formula}
            </div>

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Structure / Example
                        </th>

                        <th>
                            தமிழ் பொருள்
                        </th>

                        <th>
                            Example Sentence & Meaning
                        </th>

                    </tr>

                </thead>

                <tbody>
                    ${tableRows}
                </tbody>

            </table>

        </div>
    `;


    document.getElementById(
        "quiz-topic-badge"
    ).innerText =
        `${topic.title} Quiz`;

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffleArray(array) {

    let arr = [...array];

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] =
            [arr[j], arr[i]];

    }

    return arr;

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    const topic =
        presentPerfectContinuousTopics[currentTopicIndex];

    const q =
        topic.questions[currentQuestionIndex];


    document.getElementById(
        "quiz-progress-text"
    ).innerText =
        `Question ${currentQuestionIndex + 1} / ${topic.questions.length}`;


    document.getElementById(
        "question-text"
    ).innerText =
        `${currentQuestionIndex + 1}. ${q.q}`;


    document.getElementById(
        "question-tamil-text"
    ).innerText =
        q.tq;


    let optionObjects =
        q.o.map((optText, idx) => ({

            text: optText,

            isCorrect: idx === q.a

        }));


    currentShuffledOptions =
        shuffleArray(optionObjects);


    const optionsGrid =
        document.getElementById(
            "options-container"
        );

    optionsGrid.innerHTML = "";


    currentShuffledOptions.forEach(
        (optObj, idx) => {

            const btn =
                document.createElement("button");

            btn.className =
                "option-btn";

            btn.innerText =
                optObj.text;

            btn.onclick =
                () => selectOption(idx);

            optionsGrid.appendChild(btn);

        }
    );


    const feedback =
        document.getElementById(
            "feedback-box"
        );

    feedback.style.display = "none";

    feedback.className =
        "feedback-box";

    feedback.innerHTML = "";


    document.getElementById(
        "next-btn"
    ).disabled = true;


    selectedOptionIndex = null;

}


/* =========================================================
   SELECT OPTION
========================================================= */

function selectOption(index) {

    if (selectedOptionIndex !== null) {
        return;
    }

    selectedOptionIndex = index;


    const topic =
        presentPerfectContinuousTopics[currentTopicIndex];

    const q =
        topic.questions[currentQuestionIndex];


    const options =
        document.getElementById(
            "options-container"
        ).children;


    const feedback =
        document.getElementById(
            "feedback-box"
        );


    const isCorrectAnswer =
        currentShuffledOptions[index].isCorrect;


    if (isCorrectAnswer) {

        score++;

        options[index]
            .classList
            .add("selected-correct");


        feedback.className =
            "feedback-box correct";


        feedback.innerHTML =
            `<b>✓ சரியான பதில்!</b> ${q.e}`;

    } else {

        options[index]
            .classList
            .add("selected-wrong");


        const correctIndex =
            currentShuffledOptions
                .findIndex(
                    item => item.isCorrect
                );


        options[correctIndex]
            .classList
            .add("selected-correct");


        feedback.className =
            "feedback-box wrong";


        feedback.innerHTML =
            `<b>✗ தவறான பதில்!</b> ${q.e}`;

    }


    Array.from(options)
        .forEach(opt => {
            opt.disabled = true;
        });


    document.getElementById(
        "next-btn"
    ).disabled = false;

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    const topic =
        presentPerfectContinuousTopics[currentTopicIndex];


    if (
        currentQuestionIndex <
        topic.questions.length - 1
    ) {

        currentQuestionIndex++;

        loadQuestion();

    } else {

        showResults();

    }

}


/* =========================================================
   RESULTS
========================================================= */

function showResults() {

    const topic =
        presentPerfectContinuousTopics[currentTopicIndex];


    document.getElementById(
        "question-runner"
    ).style.display = "none";


    document.getElementById(
        "result-runner"
    ).style.display = "block";


    document.getElementById(
        "res-score"
    ).innerText =
        `${score} / ${topic.questions.length}`;


    const percent =
        (score / topic.questions.length) * 100;


    if (percent >= 70) {

        topicProgress[currentTopicIndex] = true;

        renderProgressTracker();

        document.getElementById(
            "res-msg"
        ).innerText =
            "அற்புதமான முயற்சி! 🎉";

    } else {

        document.getElementById(
            "res-msg"
        ).innerText =
            "மீண்டும் முயற்சி செய்து பார்க்கவும்! 👍";

    }

}


/* =========================================================
   RETRY
========================================================= */

function resetCurrentQuiz() {

    loadTopic(currentTopicIndex);

}

</script>
