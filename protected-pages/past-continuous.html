    document.getElementById(
        "overall-progress-text"

/* =========================================================
   SHUFFLE
========================================================= */

function shuffleArray(array) {

    let arr = [...array];

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] =
            [arr[j], arr[i]];

    }

    return arr;
}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    const topic =
        pastContinuousTopics[currentTopicIndex];

    const question =
        topic.questions[currentQuestionIndex];

    selectedOptionIndex = null;

    currentShuffledOptions =
        shuffleArray(
            question.o.map((text, index) => ({
                text,
                originalIndex: index
            }))
        );

    document.getElementById(
        "question-text"
    ).innerText =
        question.q;

    document.getElementById(
        "question-tamil-text"
    ).innerText =
        question.tq;

    document.getElementById(
        "quiz-progress-text"
    ).innerText =
        `Question ${currentQuestionIndex + 1} / ${topic.questions.length}`;

    const optionsContainer =
        document.getElementById("options-container");

    optionsContainer.innerHTML = "";

    currentShuffledOptions.forEach((option, index) => {

        const btn =
            document.createElement("button");

        btn.className =
            "option-btn";

        btn.innerText =
            option.text;

        btn.onclick =
            () => selectOption(index);

        optionsContainer.appendChild(btn);

    });

    const feedback =
        document.getElementById("feedback-box");

    feedback.className =
        "feedback-box";

    feedback.innerText = "";

    document.getElementById(
        "next-btn"
    ).disabled = true;

}


/* =========================================================
   SELECT OPTION
========================================================= */

function selectOption(index) {

    if (selectedOptionIndex !== null) {
        return;
    }

    selectedOptionIndex = index;

    const topic =
        pastContinuousTopics[currentTopicIndex];

    const question =
        topic.questions[currentQuestionIndex];

    const selectedOriginalIndex =
        currentShuffledOptions[index].originalIndex;

    const buttons =
        document.querySelectorAll(".option-btn");

    buttons.forEach(btn => {
        btn.disabled = true;
    });

    const feedback =
        document.getElementById("feedback-box");

    if (
        selectedOriginalIndex === question.a
    ) {

        buttons[index].classList.add(
            "selected-correct"
        );

        score++;

        feedback.className =
            "feedback-box correct";

        feedback.innerHTML =
            `✓ சரியான பதில்!<br>${question.e}`;

    } else {

        buttons[index].classList.add(
            "selected-wrong"
        );

        buttons.forEach((btn, i) => {

            if (
                currentShuffledOptions[i].originalIndex
                === question.a
            ) {
                btn.classList.add(
                    "selected-correct"
                );
            }

        });

        feedback.className =
            "feedback-box wrong";

        feedback.innerHTML =
            `✗ தவறான பதில்.<br>
             சரியான பதில்: <b>${question.o[question.a]}</b><br>
             ${question.e}`;

    }

    document.getElementById(
        "next-btn"
    ).disabled = false;

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    const topic =
        pastContinuousTopics[currentTopicIndex];

    if (
        currentQuestionIndex <
        topic.questions.length - 1
    ) {

        currentQuestionIndex++;

        loadQuestion();

    } else {

        showResult();

    }

}


/* =========================================================
   RESULT
========================================================= */

function showResult() {

    document.getElementById(
        "question-runner"
    ).style.display = "none";

    document.getElementById(
        "result-runner"
    ).style.display = "block";

    const total =
        pastContinuousTopics[currentTopicIndex]
            .questions.length;

    document.getElementById(
        "res-score"
    ).innerText =
        `${score}/${total}`;

    let message = "";

    const percentage =
        (score / total) * 100;

    if (percentage >= 90) {

        message =
            "🎉 Excellent! Past Continuous உங்களுக்கு நன்றாக புரிந்துள்ளது!";

    } else if (percentage >= 70) {

        message =
            "👏 Very Good! இன்னும் கொஞ்சம் practice செய்தால் சிறப்பாக இருக்கும்.";

    } else if (percentage >= 50) {

        message =
            "👍 Good! மேலும் practice செய்யுங்கள்.";

    } else {

        message =
            "📚 இன்னும் கொஞ்சம் படித்து மீண்டும் முயற்சி செய்யுங்கள்.";

    }

    document.getElementById(
        "res-msg"
    ).innerText =
        message;

    topicProgress[currentTopicIndex] = true;

    renderProgressTracker();

}


/* =========================================================
   RESET QUIZ
========================================================= */

function resetCurrentQuiz() {

    loadTopic(currentTopicIndex);

}

</script>
