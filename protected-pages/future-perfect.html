<script>

/* =========================================================

const generateBasicQuestions = () => {

    const raw = [

        [
            "We ______ the work before lunch.",

let currentTopicIndex = 0;

/* =========================================================

========================================================= */

window.onload = function () {

    renderProgressTracker();

    loadTopic(0);

};


/* =========================================================
   PROGRESS TRACKER
========================================================= */

function renderProgressTracker() {

    const grid =
        document.getElementById("progress-tracker-grid");

    grid.innerHTML = "";

    const completedCount =
        topicProgress.filter(Boolean).length;

    document.getElementById(
        "overall-progress-text"
    ).innerText =
        `${completedCount} / ${futurePerfectTopics.length} Completed`;


    futurePerfectTopics.forEach((topic, idx) => {

        const item =
            document.createElement("div");

        item.className =
            `progress-item ${topicProgress[idx] ? "completed" : ""}`;

        item.onclick =
            () => loadTopic(idx);

        item.innerHTML = `

            <div class="check-icon">
                ${topicProgress[idx] ? "✓" : idx + 1}
            </div>

            <span>
                ${topic.title}
            </span>

        `;

        grid.appendChild(item);

    });

}


/* =========================================================
   TOPIC PILLS
========================================================= */

function renderPills() {

    const pillsContainer =
        document.getElementById("topic-pills");

    pillsContainer.innerHTML = "";

    futurePerfectTopics.forEach((topic, idx) => {

        const btn =
            document.createElement("button");

        btn.className =
            `pill-btn ${idx === currentTopicIndex ? "active" : ""}`;

        btn.innerText =
            topic.title;

        btn.onclick =
            () => loadTopic(idx);

        pillsContainer.appendChild(btn);

    });

}


/* =========================================================
   LOAD TOPIC
========================================================= */

function loadTopic(index) {

    currentTopicIndex = index;

    currentQuestionIndex = 0;

    score = 0;

    selectedOptionIndex = null;

    renderPills();

    renderTopicContent();

    loadQuestion();

    document.getElementById("question-runner").style.display = "block";

    document.getElementById("result-runner").style.display = "none";

}

                Future Perfect Formula:
            </strong>

            <div class="formula-line">
                ${topic.formula}
            </div>

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Structure / Example
                        </th>

                        <th>
                            தமிழ் பொருள்
                        </th>

                        <th>
                            Example Sentence & Meaning
                        </th>

                    </tr>

                </thead>

                <tbody>
                    ${tableRows}
                </tbody>

            </table>

        </div>
    `;

    document.getElementById(
        "quiz-topic-badge"
    ).innerText =
        `${topic.title} Quiz`;

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffleArray(array) {

    let arr = [...array];

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] =
            [arr[j], arr[i]];

    }

    return arr;
}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion() {

    const topic =
        futurePerfectTopics[currentTopicIndex];

    const q =
        topic.questions[currentQuestionIndex];

    selectedOptionIndex = null;

    document.getElementById(
        "question-text"
    ).innerText = q.q;

    document.getElementById(
        "question-tamil-text"
    ).innerText = q.tq;

    document.getElementById(
        "quiz-progress-text"
    ).innerText =
        `Question ${currentQuestionIndex + 1} / ${topic.questions.length}`;


    const feedback =
        document.getElementById("feedback-box");

    feedback.className = "feedback-box";

    feedback.innerHTML = "";


    const nextBtn =
        document.getElementById("next-btn");

    nextBtn.disabled = true;


    const optionsContainer =
        document.getElementById("options-container");

    optionsContainer.innerHTML = "";


    currentShuffledOptions =
        shuffleArray(
            q.o.map((text, index) => ({
                text: text,
                isCorrect: index === q.a
            }))
        );


    currentShuffledOptions.forEach(
        (option, index) => {

            const btn =
                document.createElement("button");

            btn.className = "option-btn";

            btn.innerText =
                option.text;

            btn.onclick =
                () => selectOption(index);

            optionsContainer.appendChild(btn);

        }
    );

}


/* =========================================================
   SELECT OPTION
========================================================= */

function selectOption(index) {

    if (selectedOptionIndex !== null) {
        return;
    }

    selectedOptionIndex = index;

    const topic =
        futurePerfectTopics[currentTopicIndex];

    const q =
        topic.questions[currentQuestionIndex];

    const options =
        document.getElementById(
            "options-container"
        ).children;

    const feedback =
        document.getElementById(
            "feedback-box"
        );

    const isCorrectAnswer =
        currentShuffledOptions[index].isCorrect;


    if (isCorrectAnswer) {

        score++;

        options[index]
            .classList
            .add("selected-correct");

        feedback.className =
            "feedback-box correct";

        feedback.innerHTML =
            `<b>✓ சரியான பதில்!</b> ${q.e}`;

    } else {

        options[index]
            .classList
            .add("selected-wrong");

        const correctIndex =
            currentShuffledOptions
                .findIndex(
                    item => item.isCorrect
                );

        options[correctIndex]
            .classList
            .add("selected-correct");

        feedback.className =
            "feedback-box wrong";

        feedback.innerHTML =
            `<b>✗ தவறான பதில்!</b> ${q.e}`;

    }


    Array.from(options)
        .forEach(opt => {
            opt.disabled = true;
        });


    document.getElementById(
        "next-btn"
    ).disabled = false;

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    const topic =
        futurePerfectTopics[currentTopicIndex];

    if (
        currentQuestionIndex <
        topic.questions.length - 1
    ) {

        currentQuestionIndex++;

        loadQuestion();

    } else {

        showResults();

    }

}


/* =========================================================
   RESULTS
========================================================= */

function showResults() {

    const topic =
        futurePerfectTopics[currentTopicIndex];

    document.getElementById(
        "question-runner"
    ).style.display = "none";

    document.getElementById(
        "result-runner"
    ).style.display = "block";

    document.getElementById(
        "res-score"
    ).innerText =
        `${score} / ${topic.questions.length}`;

    const percent =
        (score / topic.questions.length) * 100;

    if (percent >= 70) {

        topicProgress[currentTopicIndex] = true;

        renderProgressTracker();

        document.getElementById(
            "res-msg"
        ).innerText =
            "அற்புதமான முயற்சி! 🎉";

    } else {

        document.getElementById(
            "res-msg"
        ).innerText =
            "மீண்டும் முயற்சி செய்து பார்க்கவும்! 👍";

    }

}


/* =========================================================
   RETRY
========================================================= */

function resetCurrentQuiz() {

    loadTopic(currentTopicIndex);

}

</script>
